<!doctype html>
<html lang="en-CA">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page not found · Friendship Quest</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; text-align: center; background: #14112a; color: #f6f2ff; font-family: system-ui, sans-serif; padding: 16px; }
      a { color: #ffb36b; font-weight: 700; }
    </style>
    <script>
      // GitHub Pages serves this file for unknown paths. Send the visitor to the app,
      // turning /<repo>/privacy into /<repo>/#/privacy. On *.github.io the first path
      // segment is the repository; on a custom domain the app is at the root.
      (function () {
        var parts = location.pathname.split('/').filter(Boolean);
        var base = /\.github\.io$/.test(location.hostname) && parts.length ? '/' + parts.shift() + '/' : '/';
        location.replace(base + '#/' + parts.join('/'));
      })();
    </script>
  </head>
  <body>
    <main>
      <h1>Off the map</h1>
      <p><a href="/friendship-match-quest-game/">Go to Friendship Quest</a></p>
    </main>
  </body>
</html>
