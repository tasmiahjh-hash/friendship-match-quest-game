name: Test and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # Install scripts aren't needed to build or test, and skipping them avoids
      # downloading the Supabase CLI.
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e -- --project=desktop --project=small-phone --project=iphone

  build:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci --ignore-scripts
      - name: Build and check
        env:
          # Repository variables, not secrets: all of these are public in the built site.
          VITE_SUBMISSION_ENDPOINT: ${{ vars.VITE_SUBMISSION_ENDPOINT }}
          VITE_CONTACT_EMAIL: ${{ vars.VITE_CONTACT_EMAIL }}
          VITE_PRIVACY_CONTACT_EMAIL: ${{ vars.VITE_PRIVACY_CONTACT_EMAIL }}
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          SITE_ORIGIN: ${{ steps.pages.outputs.origin }}
        run: |
          npm run build
          npm run check:release
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
